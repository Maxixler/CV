<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4E7D3">
  <title>404 — Page Not Found | Eren Kale</title>
  <style>
    :root {
      --paper: #F4E7D3;
      --ink: #211B17;
      --cobalt: #2947A9;
      --vermilion: #D64D30;
      --signal-yellow: #F0BC3B;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(33, 27, 23, 0.12) 50%, transparent 50.2%),
        var(--paper);
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      width: min(100%, 42rem);
      border: 3px solid var(--ink);
      padding: clamp(1.5rem, 6vw, 4rem);
      background: var(--paper);
      box-shadow: 0.75rem 0.75rem 0 var(--signal-yellow);
    }

    .index {
      margin: 0 0 1rem;
      color: var(--cobalt);
      font-family: Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      color: var(--vermilion);
      font-family: Georgia, serif;
      font-size: clamp(5rem, 20vw, 11rem);
      font-weight: 400;
      line-height: 0.8;
    }

    h2 {
      margin: 1.5rem 0 0.75rem;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1;
    }

    p {
      max-width: 42ch;
      margin: 0 0 2rem;
      font-size: 1.05rem;
    }

    a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border: 2px solid var(--ink);
      color: var(--paper);
      background: var(--cobalt);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0.3rem 0.3rem 0 var(--ink);
    }

    a:hover {
      color: var(--ink);
      background: var(--signal-yellow);
    }

    a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px var(--signal-yellow);
    }
  </style>
</head>
<body>
  <main>
    <p class="index">ERROR / 404</p>
    <h1>404</h1>
    <h2>Signal not found.</h2>
    <p>The page may have moved, but the portfolio is still available from the home page.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
